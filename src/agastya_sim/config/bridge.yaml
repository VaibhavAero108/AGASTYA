# ROS 2 <-> Gazebo bridge for AGASTYA.
# Control topics go straight to the AgastyaDynamics system inside Gazebo,
# which applies one wrench per physics step on simulation time.

# ---------------- Gazebo -> ROS ----------------
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /agastya/odometry
  gz_topic_name: /agastya/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /agastya/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /agastya/imu
  gz_topic_name: /agastya/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
# raw camera; link_sim republishes it as /agastya/fpv/image (link-degraded)
- ros_topic_name: /agastya/fpv/image_raw
  gz_topic_name: /agastya/fpv/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /agastya/fpv/camera_info
  gz_topic_name: /agastya/fpv/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /agastya/status
  gz_topic_name: /agastya/status
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS

# ---------------- ROS -> Gazebo ----------------
- ros_topic_name: /agastya/cmd_vel
  gz_topic_name: /agastya/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /agastya/mode
  gz_topic_name: /agastya/mode
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: ROS_TO_GZ
- ros_topic_name: /agastya/link_mode
  gz_topic_name: /agastya/link_mode
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: ROS_TO_GZ
- ros_topic_name: /agastya/depth/setpoint
  gz_topic_name: /agastya/depth/setpoint
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
